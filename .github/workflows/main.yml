name: encode-ios-alpha
on: workflow_dispatch

jobs:
  encode:
    runs-on: macos-latest
    steps:
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Install gdown
        run: pip3 install gdown --break-system-packages

      - name: Download source video
        run: gdown "1-SMwTlwDNLWlnaBVJqJkgPSfU--cjjhs" -O source.mov

      - name: Verify download
        run: ls -lh source.mov && file source.mov

      - name: Encode 1080p bitrate ladder
        run: |
          ffmpeg -i source.mov -t 14 -vf scale=1080:-2,fps=24 -c:v libx265 -crf 24 -preset slow -tag:v hvc1 -pix_fmt yuva420p -an ios_1080.mov

      - name: Show file sizes
        run: ls -lh ios_*.mov

      - name: Upload variants
        uses: actions/upload-artifact@v4
        with:
          name: ios_variants
          path: ios_*.mov