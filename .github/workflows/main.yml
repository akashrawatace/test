name: encode-ios-alpha
on: workflow_dispatch
jobs:
  encode:
    runs-on: macos-latest
    steps:
      - run: brew install ffmpeg
      - name: Download source video
        run: curl -L "https://drive.google.com/file/d/1-SMwTlwDNLWlnaBVJqJkgPSfU--cjjhs/view?usp=sharing" -o source.mov
      - run: ffmpeg -i source.mov -vf scale=1080:-2 -c:v hevc_videotoolbox -alpha_quality 0.9 -vtag hvc1 -an ios_alpha.mov
      - uses: actions/upload-artifact@v4
        with:
          name: ios_alpha
          path: ios_alpha.mov
